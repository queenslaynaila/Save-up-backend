info:
  version: 1.0.0
  title: Security Questions API
  description: API for managing security questions
tags:
  - name: Security Questions
    description: Endpoints for managing security questions
openapi: ""
components:
  schemas: {}
  parameters: {}
paths:
  /security-questions:
    get:
      summary: Get all security questions
      tags:
        - Security Questions
      responses:
        "200":
          description: List of security questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  question:
                    type: string
                required:
                  - id
                  - question
        "401":
          description: Access denied. Log in.
        "500":
          description: Internal server error.
