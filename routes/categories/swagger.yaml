components:
  schemas:
    Category:
      type: object
      required:
        - id
        - name
        - description
        - created_at
      properties:
        id:
          type: number
          description: The unique identifier of the category.
        name:
          type: string
          description: The name of the category.
        description:
          type: string
          description: The description of the category.
        created_at:
          type: string
          format: date-time
          description: The date and time when the category was created.
      example:
        id: 1
        name: Food
        description: This is a food category.
        created_at: '2022-04-18T12:00:00Z'

tags:
  - name: Categories
    description: The categories API endpoints

/categories:
  get:
    summary: Returns the list of all categories
    tags: [Categories]
    responses:
      '200':
        description: The list of categories
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Category'
  post:
    summary: Create a new category.ADMIN ONLY
    tags: [Categories]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
    responses:
      '201':
        description: Category created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      '403':
        description: Forbidden
      '500':
        description: Internal server error

/categories/{id}:
  patch:
    summary: Update a category by ID
    tags: [Categories]
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: ID of the category to update
    requestBody:
      required: [name, description]
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The category name.
                nullable: true
              description:
                type: string
                description: The category description.
                nullable: true
    responses:
      '200':
        description: Category updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      '400':
        description: Bad request, check request body
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string

/categories/records/{id}:
  patch:
    summary: Soft delete a category by ID
    tags: [Categories]
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: ID of the category to delete
    responses:
      '204':
        description: Category deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
