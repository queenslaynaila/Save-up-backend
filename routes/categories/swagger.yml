info:
  version: 1.0.0
  title: SAPI
  description: API for managing categories
tags:
  - name: Categories
    description: Endpoints for managing categories
openapi: ""
components:
  schemas:
    Category:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        id:
          type: number
        created_at:
          type: string
      required:
        - name
        - description
        - id
        - created_at
  parameters: {}
paths:
  /categories:
    post:
      summary: Create a new category.ADMIN ONLY
      tags:
        - Categories
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
                - name
                - description
      responses:
        "200":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Forbidden
        "500":
          description: Internal server error.
    get:
      summary: Returns an array of all categories object
      tags:
        - Categories
      responses:
        "200":
          description: Saving retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    id:
                      type: number
                    created_at:
                      type: string
                  required:
                    - name
                    - description
                    - id
                    - created_at
        "403":
          description: Unprocessable entity
        "500":
          description: Internal server error.
  "/categories/{id}":
    patch:
      summary: Update a category
      tags:
        - Categories
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  id:
                    type: number
                  created_at:
                    type: string
                required:
                  - name
                  - description
                  - id
                  - created_at
        "400":
          description: Category not found
        "500":
          description: Internal server error.
  "/categories/records/{id}":
    patch:
      summary: Soft deletes a category
      tags:
        - Categories
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "404":
          description: Category not found
        "500":
          description: Internal server error.
