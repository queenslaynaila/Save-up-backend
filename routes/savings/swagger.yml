info:
  version: 1.0.0
  title: SAPI
  description: API for managing savings
tags:
  - name: Savings
    description: Endpoints for managing savings
openapi: ""
components:
  schemas: {}
  parameters: {}
paths:
  /savings:
    post:
      summary: Create a saving
      tags:
        - Savings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                goal_id:
                  type: number
                amount:
                  type: number
              required:
                - goal_id
                - amount
      responses:
        "200":
          description: Saving created successfully.
        "403":
          description: Unprocessable entity
        "500":
          description: Internal server error.
  "/savings/records/{id}":
    get:
      summary: Get a saving by ID
      tags:
        - Savings
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Saving retrieved successfully
        "403":
          description: Unprocessable entity
        "500":
          description: Internal server error.
  "/savings/{savingIdentifier}":
    get:
      summary: Get savings by criteria
      tags:
        - Savings
      parameters:
        - schema:
            type: string
          required: true
          name: savingIdentifier
          in: path
      responses:
        "200":
          description: Savings retrieved successfully
        "403":
          description: Unprocessable entity
        "500":
          description: Internal server error.
