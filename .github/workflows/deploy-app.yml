name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KE }}

      - name: Deploy to Server
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd mpot/Save-up-backend && git pull origin main && git reset --hard origin/main && npm install &&  rm -rf dist && npm run build && pm2 restart saveup" 2>&1 | tee deployment_log.txt