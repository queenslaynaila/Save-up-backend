name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no queenslay@143.110.177.208 << 'EOF'
          cd mpot/Save-up-backend
          git fetch origin
          git reset --hard origin/main
          npm install
          npm run build
          pm2 restart Save-up-backend 
          EOF

